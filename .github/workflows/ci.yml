name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://paytrail:paytrail@localhost:5432/paytrail?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: paytrail
          POSTGRES_PASSWORD: paytrail
          POSTGRES_DB: paytrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paytrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/generated is gitignored — regenerate before typecheck/build
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Generate route types (.next/types) that tsconfig includes — LayoutProps etc.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
